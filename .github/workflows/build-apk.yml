name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 20
          cache: 'npm'

      - name: Set up Java JDK
        uses: actions/setup-java@8df1039502a140fb61166adf84b68c455c898397 # v4.3.0
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@b5a2ee09971933e147171d18258b3c5a610f46c6 # v3.2.1

      - name: Install Client Dependencies
        run: |
          cd client
          npm install

      - name: Build Web Bundle & Sync Capacitor
        run: |
          cd client
          npm run build
          npx cap sync android

      - name: Build Debug APK
        run: |
          cd client/android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: inks-by-trackify-apk
          path: client/android/app/build/outputs/apk/debug/app-debug.apk
