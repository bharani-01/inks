<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sign in to your Printa account to manage your print orders.">
  <title>Sign In — Printa</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card card" style="padding: 36px;">

      <div class="logo">
        <span class="brand-logo-text">Printa</span>
      </div>

      <h1>Welcome back</h1>
      <p class="subtitle">Sign in to your account to continue</p>

      <!-- Dev Quick Fill -->
      <div id="quick-fill" style="margin-bottom: 20px; padding: 14px; background: #FFFBEB; border: 1px solid #FDE68A; border-radius: 8px;">
        <p style="font-size: 0.75rem; font-weight: 600; color: #92400E; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.05em;" id="quick-fill-label"></p>
        <div style="display: flex; gap: 8px;">
          <button type="button" onclick="quickFill('admin@printa.com','admin123')" class="btn btn-sm" style="flex:1; background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E;" id="qf-admin"></button>
          <button type="button" onclick="quickFill('test@test.com','test123')" class="btn btn-sm" style="flex:1; background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E;" id="qf-user"></button>
        </div>
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="Enter your password" autocomplete="current-password" required>
            <button type="button" class="toggle-password" id="pwd-toggle"></button>
          </div>
          <div class="form-error" id="password-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
          Sign In
        </button>
      </form>

      <p class="footer-text">
        Don't have an account? <a href="/register">Create one</a>
      </p>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script>
    // Populate SVG icons
    document.getElementById('logo-icon').innerHTML = icons.printer;
    document.getElementById('pwd-toggle').innerHTML = icons.eye;
    document.getElementById('quick-fill-label').innerHTML = icons.zap + ' Quick fill (dev only)';
    document.getElementById('qf-admin').innerHTML = icons.shield + ' Admin';
    document.getElementById('qf-user').innerHTML = icons.user + ' Test User';

    // Redirect if already logged in
    if (isAuthenticated()) {
      window.location.href = getDashboardPath(api.getUser());
    }
  </script>
  <script src="/js/auth.js"></script>
</body>
</html>
