<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Create your Printa account to start printing documents.">
  <title>Create Account — Printa</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="auth-layout">
    <div class="auth-card card" style="padding: 36px;">

      <div class="logo">
        <span class="brand-logo-text">Printa</span>
      </div>

      <h1>Create your account</h1>
      <p class="subtitle">Get started with Printa in seconds</p>

      <form id="register-form" novalidate>
        <div class="form-group">
          <label class="form-label" for="name">Full name</label>
          <input type="text" id="name" name="name" class="form-input" placeholder="John Doe" autocomplete="name" required>
          <div class="form-error" id="name-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="email">Email address</label>
          <input type="email" id="email" name="email" class="form-input" placeholder="you@example.com" autocomplete="email" required>
          <div class="form-error" id="email-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="phone">Phone number <span class="text-muted">(optional)</span></label>
          <input type="tel" id="phone" name="phone" class="form-input" placeholder="9876543210" autocomplete="tel">
          <div class="form-error" id="phone-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <div class="input-wrapper">
            <input type="password" id="password" name="password" class="form-input" placeholder="Minimum 6 characters" autocomplete="new-password" required>
            <button type="button" class="toggle-password" id="pwd-toggle-1"></button>
          </div>
          <div class="form-error" id="password-error"></div>
        </div>

        <div class="form-group">
          <label class="form-label" for="confirmPassword">Confirm password</label>
          <div class="input-wrapper">
            <input type="password" id="confirmPassword" name="confirmPassword" class="form-input" placeholder="Re-enter your password" autocomplete="new-password" required>
            <button type="button" class="toggle-password" id="pwd-toggle-2"></button>
          </div>
          <div class="form-error" id="confirmPassword-error"></div>
        </div>

        <button type="submit" class="btn btn-primary btn-block btn-lg" style="margin-top: 8px;">
          Create Account
        </button>
      </form>

      <p class="footer-text">
        Already have an account? <a href="/login">Sign in</a>
      </p>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.getElementById('logo-icon').innerHTML = icons.printer;
    document.getElementById('pwd-toggle-1').innerHTML = icons.eye;
    document.getElementById('pwd-toggle-2').innerHTML = icons.eye;

    if (isAuthenticated()) {
      window.location.href = getDashboardPath(api.getUser());
    }
  </script>
  <script src="/js/auth.js"></script>
</body>
</html>
