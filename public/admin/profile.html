<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Printa Admin — Profile settings.">
  <title>Profile — Printa Admin</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <div class="mobile-header">
    <span class="brand-logo-text">Printa</span>
  </div>
  <div class="sidebar-backdrop"></div>

  <div class="app-layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <span class="brand-logo-text">Printa</span>
      </div>
      <nav class="sidebar-nav">
        <div class="nav-section">
          <div class="nav-section-title">Overview</div>
          <a href="/admin/dashboard" class="nav-item" data-page="dashboard">
            <span class="nav-icon" data-icon="barChart"></span><span>Dashboard</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Management</div>
          <a href="/admin/orders" class="nav-item" data-page="orders">
            <span class="nav-icon" data-icon="package"></span><span>Print Orders</span>
          </a>
          <a href="/admin/documents" class="nav-item" data-page="documents">
            <span class="nav-icon" data-icon="fileText"></span><span>Documents</span>
          </a>
          <a href="/admin/users" class="nav-item" data-page="users">
            <span class="nav-icon" data-icon="users"></span><span>Users</span>
          </a>
          <a href="/admin/pricing" class="nav-item" data-page="pricing">
            <span class="nav-icon" data-icon="settings"></span><span>Pricing Config</span>
          </a>
        </div>
        <div class="nav-section">
          <div class="nav-section-title">Account</div>
          <a href="/admin/profile" class="nav-item active" data-page="profile">
            <span class="nav-icon" data-icon="user"></span><span>My Profile</span>
          </a>
        </div>
      </nav>
      <div class="sidebar-footer">
        <div class="sidebar-user">
          <div class="user-avatar">A</div>
          <div>
            <div class="user-name">Admin</div>
            <div class="user-role">Administrator</div>
          </div>
        </div>
        <button id="logout-btn" class="nav-item" style="margin-top: 4px; color: var(--error);">
          <span class="nav-icon" data-icon="logOut"></span><span>Sign Out</span>
        </button>
      </div>
    </aside>

    <main class="main-content">
      <div class="page-header">
        <h1>Profile</h1>
        <p class="page-subtitle">Manage your personal information and password</p>
      </div>
      <div class="page-body">
        <div class="card" style="margin-bottom: 24px;">
          <div style="display: flex; align-items: center; gap: 20px; margin-bottom: 20px; padding-bottom: 20px; border-bottom: 1px solid var(--border);">
            <div id="profile-avatar" style="width: 64px; height: 64px; border-radius: 50%; background: var(--accent-light); color: var(--accent); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.5rem; flex-shrink: 0;">A</div>
            <div>
              <h2 id="profile-name" style="margin-bottom: 2px;">Loading...</h2>
              <p class="text-muted"><span id="profile-email">—</span></p>
              <div style="display: flex; gap: 8px; margin-top: 6px;">
                <span class="badge badge-accent" id="profile-role">Admin</span>
                <span class="text-muted" style="font-size: 0.8125rem;">Joined <span id="profile-joined">—</span></span>
              </div>
            </div>
          </div>
        </div>

        <div class="profile-grid">
          <div class="card profile-section">
            <h2>Edit Profile</h2>
            <form id="profile-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="prof-name">Full name</label>
                <input type="text" id="prof-name" name="name" class="form-input" placeholder="Your name">
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-email">Email address</label>
                <input type="email" id="prof-email" name="email" class="form-input" placeholder="you@example.com">
              </div>
              <div class="form-group">
                <label class="form-label" for="prof-phone">Phone number</label>
                <input type="tel" id="prof-phone" name="phone" class="form-input" placeholder="9876543210">
              </div>
              <button type="submit" class="btn btn-primary">Save Changes</button>
            </form>
          </div>
          <div class="card profile-section">
            <h2>Change Password</h2>
            <form id="password-form" novalidate>
              <div class="form-group">
                <label class="form-label" for="currentPassword">Current password</label>
                <div class="input-wrapper">
                  <input type="password" id="currentPassword" name="currentPassword" class="form-input" placeholder="Enter current password">
                  <button type="button" class="toggle-password" id="pt-1"></button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="newPassword">New password</label>
                <div class="input-wrapper">
                  <input type="password" id="newPassword" name="newPassword" class="form-input" placeholder="Minimum 6 characters">
                  <button type="button" class="toggle-password" id="pt-2"></button>
                </div>
              </div>
              <div class="form-group">
                <label class="form-label" for="confirmNewPassword">Confirm new password</label>
                <div class="input-wrapper">
                  <input type="password" id="confirmNewPassword" name="confirmNewPassword" class="form-input" placeholder="Re-enter new password">
                  <button type="button" class="toggle-password" id="pt-3"></button>
                </div>
              </div>
              <button type="submit" class="btn btn-primary">Update Password</button>
            </form>
          </div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/admin/js/router.js"></script>
  <script>
    document.getElementById('pt-1').innerHTML = icons.eye;
    document.getElementById('pt-2').innerHTML = icons.eye;
    document.getElementById('pt-3').innerHTML = icons.eye;
  </script>
  <script src="/admin/js/profile.js"></script>
</body>
</html>
